# Acessa o servidor do Render a cada 10 minutos para ele não "dormir"
# (no plano gratuito ele desliga após 15 minutos sem uso).
name: Manter servidor acordado

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - run: curl -fsS --retry 3 --max-time 90 https://data-page-pesquisa-api.onrender.com/
